quarkus.application.name=pst-api-service
quarkus.http.root-path=/pst/api

%dev.quarkus.log.level=DEBUG
%prod.quarkus.log.level=INFO
quarkus.log.file.enabled=true
quarkus.hibernate-orm.log.sql=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=polaris
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/polaris
quarkus.datasource.devservices.enabled=false
#quarkus.datasource.devservices.enabled=true
#quarkus.datasource.devservices.port=64474 # don't fix the value, test won't run

quarkus.mailer.host=smtp1.astron.nl
quarkus.mailer.port=25
quarkus.mailer.login=NONE
quarkus.mailer.from=eldering@jive.eu
quarkus.mailer.tls=false
quarkus.mailer.start-tls=DISABLED
%prod.quarkus.mailer.mock=false
%dev,test.quarkus.mailer.mock=true

#https://quarkus.io/guides/hibernate-orm#multiple-persistence-units
#quarkus.hibernate-orm.datasource=pstdb
quarkus.hibernate-orm.packages=org.ivoa.dm,org.ivoa.vodml.stdtypes,org.orph2020.pst.apiimpl.entities
#do not let the database update automatically, check this in production and test the procedure in development
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.scripts.generation=update
%dev.quarkus.hibernate-orm.scripts.generation.create-target=/home/eldering/polaris/pst-api-service/proposalddl.sql
%prod.quarkus.hibernate-orm.scripts.generation.create-target=/tmp/proposalddl.sql
#note latest documentation has this, but it doesn't work for the current version
# %prod.quarkus.hibernate-orm.schema-management.strategy = none
quarkus.hibernate-orm.database.generation.create-schemas=false
quarkus.hibernate-orm.database.generation.halt-on-error=false
# Liquibase minimal config properties
quarkus.liquibase.migrate-at-start=false

quarkus.hibernate-orm.quote-identifiers.strategy = all

%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.bind-parameters=true
# the following two properties are an attempt to work around hibernate 6.6
quarkus.hibernate-orm.second-level-caching-enabled=false
quarkus.hibernate-orm.flush.mode=always

#TODO do we really want CORS on? - in production yes
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=/.*/
%prod.quarkus.http.cors.origins=https://polaris.jive.eu
quarkus.http.port=8084
quarkus.http.test-port=8085
quarkus.jackson.serialization-inclusion=non_empty

#aai
# attach to keycloak via the backend pod network in production.
%dev.quarkus.oidc.auth-server-url=https://iams.jive.eu/realms/orppst
%prod.quarkus.oidc.auth-server-url=https://iams.jive.eu/realms/orppst
polaris-realm-name=orppst
auth-server-master=https://iams.jive.eu
%dev.quarkus.oidc.client-id=pst-api
%prod.quarkus.oidc.client-id=pst-api-prod
#FIXME this secret should come from a vault (same as for the GUI)
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.application-type=service

#Documents store root location
%dev,test.document-store.root=/home/eldering/documentStore/
%prod.document-store.root=/home/eldering/documentStore/
document-store.supportingDocuments-path=supportingDocuments/
document-store.justifications-path=supportingDocuments/justifications/

#Maximum size of an individual request i.e., max size of a supporting document
quarkus.http.limits.max-body-size=100M

#openAPI
quarkus.smallrye-graphql.ui.always-include=true
quarkus.swagger-ui.always-include=true
#trying to get schema types in the ui inthe included jar...
quarkus.swagger-ui.deep-linking=true
#mp.openapi.scan.packages=org.ivoa.dm,org.ivoa.vodml.stdtypes - disables others....
quarkus.index-dependency.propdm.group-id=org.javastro.ivoa.dm
quarkus.index-dependency.propdm.artifact-id=proposaldm
quarkus.index-dependency.propdm.classifier=quarkus
quarkus.swagger-ui.theme=flattop
mp.openapi.extensions.smallrye.operationIdStrategy=CLASS_METHOD
mp.openapi.extensions.smallrye.duplicateOperationIdBehavior=FAIL
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi/

# build a native executable for prod
%prod.quarkus.native.enabled=true
%prod.quarkus.native.container-build=true
%prod.quarkus.package.jar.enabled=false
